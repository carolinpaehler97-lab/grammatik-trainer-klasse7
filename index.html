<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammatiktrainer Klasse 7</title><style>body{font-family:system-ui;background:#f3f6fc;color:#1c2940;margin:0}main{max-width:720px;margin:auto;padding:25px}h1{font-size:2rem}.card{background:white;border:1px solid #dde4f0;border-radius:18px;padding:22px;margin:14px 0}button{background:#fff;border:1px solid #a8b6ce;border-radius:12px;padding:13px;font:inherit;cursor:pointer;margin:5px}button:hover{background:#eaf0ff}.primary{background:#3159c9;color:white}.hidden{display:none}.hint{background:#fff4d5;padding:12px;border-radius:10px}.ok{color:#17733c}.bad{color:#b13b2b}</style></head><body><main><h1>✦ Grammatiktrainer 7</h1><p>Übe Wortarten und Satzglieder in deinem Tempo.</p><section id="home" class="card"><h2>Was möchtest du üben?</h2><button onclick="start('wort')">🔤 Wortarten</button><button onclick="start('satz')">🧩 Satzglieder</button></section><section id="quiz" class="card hidden"><button onclick="home()">← Zurück</button><p id="count"></p><h2 id="question"></h2><p id="example"></p><div id="answers"></div><p id="feedback" aria-live="polite"></p><div id="hint" class="hint hidden"></div><button onclick="help()">💡 Hilfe</button><button id="next" class="primary hidden" onclick="advance()">Weiter →</button></section></main><script>
const $=x=>document.getElementById(x);let active=[],pos=0,level=0,done=false,freigeschaltet=["Subjekt","Prädikat","Akkusativobjekt"];
fetch('./config.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{if(Array.isArray(x.freigeschaltet))freigeschaltet=x.freigeschaltet}).catch(()=>{});
const wort=[
{q:"Welche Wortart ist „Hund“?",s:"Der Hund schläft.",a:"Nomen",opts:["Nomen","Verb","Adjektiv","Artikel"],h:["Was bezeichnet dieses Wort?","Kann man einen Artikel davorsetzen?","Der Hund: Das Wort bezeichnet ein Lebewesen."]},
{q:"Welche Wortart ist „rennt“?",s:"Das Mädchen rennt.",a:"Verb",opts:["Nomen","Verb","Adjektiv","Artikel"],h:["Was geschieht im Satz?","Welche Tätigkeit wird beschrieben?","Das Wort ist eine gebeugte Verbform."]},
{q:"Welche Wortart ist „kleine“?",s:"Die kleine Katze miaut.",a:"Adjektiv",opts:["Nomen","Verb","Adjektiv","Artikel"],h:["Was wird beschrieben?","Wie ist die Katze?","Das Wort bezeichnet eine Eigenschaft."]},
{q:"Welche Wortart ist „Die“?",s:"Die Kinder lachen.",a:"Artikel",opts:["Nomen","Verb","Adjektiv","Artikel"],h:["Steht das Wort vor einem Nomen?","Es begleitet „Kinder“.","Es ist ein bestimmter Artikel."]},
{q:"Welche Wortart ist „wir“?",s:"Wir spielen draußen.",a:"Pronomen",opts:["Pronomen","Verb","Adjektiv","Nomen"],h:["Für wen steht das Wort?","Es ersetzt die Namen der sprechenden Personen.","Es ist ein Personalpronomen."]}
];
const satz=[
{q:"Bestimme das markierte Satzglied: „Der kleine Hund“",s:"Der kleine Hund jagt den Ball.",a:"Subjekt",opts:["Subjekt","Prädikat","Akkusativobjekt"],h:["Frage nach dem Handelnden.","Wer oder was jagt den Ball?","Der kleine Hund ist das Subjekt."]},
{q:"Bestimme das markierte Satzglied: „den Ball“",s:"Der kleine Hund jagt den Ball.",a:"Akkusativobjekt",opts:["Subjekt","Prädikat","Akkusativobjekt"],h:["Frage nach dem, was gejagt wird.","Wen oder was jagt der Hund?","„Den Ball“ ist das Akkusativobjekt."]},
{q:"Bestimme das markierte Satzglied: „jagt“",s:"Der kleine Hund jagt den Ball.",a:"Prädikat",opts:["Subjekt","Prädikat","Akkusativobjekt"],h:["Was geschieht?","Was tut der Hund?","„jagt“ ist das Prädikat."]},
{q:"Welche Frage passt zu „die Hausaufgaben“?",s:"Die Schülerin erledigt die Hausaufgaben.",a:"Wen oder was?",opts:["Wer oder was?","Wen oder was?","Was tut jemand?"],h:["Frage nach dem markierten Satzglied.","Wen oder was erledigt die Schülerin?","Damit erfragst du das Akkusativobjekt."]},
{q:"Welche Wortgruppe bleibt bei der Umstellprobe zusammen?",s:"Der freundliche Lehrer erklärt die Aufgabe.",a:"Der freundliche Lehrer",opts:["Der freundliche Lehrer","freundliche Lehrer erklärt","Lehrer erklärt die"],h:["Verschiebe Wörter an den Satzanfang.","Welche Wörter kannst du gemeinsam verschieben?","„Der freundliche Lehrer“ ist ein Satzglied."]},
{q:"Welcher Satz ist richtig umgestellt?",s:"Die Kinder lesen ein Buch.",a:"Ein Buch lesen die Kinder.",opts:["Ein Buch lesen die Kinder.","Ein lesen Buch die Kinder.","Die ein Buch Kinder lesen."],h:["Verschiebe vollständige Satzglieder.","Das gebeugte Verb bleibt an zweiter Stelle.","„Ein Buch“ kann vor dem Prädikat stehen."]}
];
function home(){$('home').classList.remove('hidden');$('quiz').classList.add('hidden')}
function start(m){active=(m==='wort'?wort:satz.filter(x=>freigeschaltet.includes(x.a)||!['Subjekt','Prädikat','Akkusativobjekt'].includes(x.a))).sort(()=>Math.random()-.5);pos=0;$('home').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){done=false;level=0;$('hint').classList.add('hidden');$('next').classList.add('hidden');$('feedback').textContent='';if(pos>=active.length){$('question').textContent='Geschafft! 🎉';$('example').textContent='Du hast alle Aufgaben bearbeitet.';$('answers').replaceChildren();$('count').textContent='';$('next').textContent='Neue Runde';$('next').classList.remove('hidden');return}let t=active[pos];$('next').textContent='Weiter →';$('count').textContent='Aufgabe '+(pos+1)+' von '+active.length;$('question').textContent=t.q;$('example').textContent=t.s;$('answers').replaceChildren();t.opts.forEach(a=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(done)return;if(a===t.a){done=true;$('feedback').className='ok';$('feedback').textContent='Richtig! Gut gemacht.';$('next').classList.remove('hidden')}else{$('feedback').className='bad';$('feedback').textContent='Noch nicht richtig. Versuch es erneut oder nutze eine Hilfe.'}};$('answers').append(b)})}
function help(){if(pos>=active.length)return;level=Math.min(3,level+1);$('hint').classList.remove('hidden');$('hint').textContent='Hilfe '+level+'/3: '+active[pos].h[level-1]}
function advance(){if(pos>=active.length){start(active===wort?'wort':'satz');return}pos++;render()}
</script></body></html>
